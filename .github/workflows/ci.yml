name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: npm audit (root, frontend, e2e)
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix frontend
          npm audit --audit-level=high --prefix e2e

  e2e:
    name: E2E (Playwright + Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the report when E2E fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
