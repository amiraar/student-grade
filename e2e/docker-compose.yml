# Throwaway database for the E2E suite. Data lives in tmpfs and is gone when the stack stops.
# The real Neon driver talks to the proxy, so queries take the same HTTP path as production.
name: student-grade-e2e

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d main']
      interval: 1s
      timeout: 3s
      retries: 30

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:54444:4444'
